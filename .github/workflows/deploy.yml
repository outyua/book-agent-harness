name: Build ebook and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir site install --frozen-lockfile

      - name: Install Playwright Chromium (PDF renderer)
        run: pnpm exec playwright install --with-deps chromium-headless-shell

      - name: Build PDF and EPUB
        run: node scripts/build-book.mjs

      - name: Build website (syncs manuscript, figures and downloads)
        run: pnpm --dir site build

      - name: Upload ebook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebook
          path: |
            output/pdf/agent-harness-engineering.pdf
            output/epub/agent-harness-engineering.epub
          retention-days: 30

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=book-agent-harness --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
