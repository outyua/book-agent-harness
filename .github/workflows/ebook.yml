name: Build ebook and publish release

# 网站由 Cloudflare Workers Builds 在推送时自行构建部署（见 wrangler.jsonc）。
# 这个工作流只负责需要 Chromium 的 PDF/EPUB 构建，并把成品挂到 GitHub Release「latest」，
# 网站首页的下载按钮指向这些附件。

on:
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "figures/**"
      - "assets/**"
      - "styles/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ebook.yml"
  workflow_dispatch:

concurrency:
  group: ebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install poppler (pdfinfo, used by the PDF build manifest)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install Playwright Chromium (PDF renderer)
        run: pnpm exec playwright install --with-deps chromium-headless-shell

      - name: Build PDF and EPUB
        run: node scripts/build-book.mjs

      # 成品提交回仓库的 site/public/downloads/，随网站一起部署到 /downloads/。
      # 用 GITHUB_TOKEN 推送不会再触发 GitHub Actions（本工作流不会自己触发自己），
      # 但会触发 Cloudflare Workers Builds 重新构建网站，首页的下载按钮随之更新。
      - name: Commit PDF and EPUB into site/public/downloads
        run: |
          mkdir -p site/public/downloads
          cp output/pdf/agent-harness-engineering.pdf output/epub/agent-harness-engineering.epub site/public/downloads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/downloads
          if git diff --cached --quiet; then
            echo "电子书没有变化，不提交"
            exit 0
          fi
          git commit -m "电子书：从 ${GITHUB_SHA::7} 重新构建 PDF/EPUB"
          # 构建会顺带改写 assets/cover.png 等未提交的文件，--autostash 先把它们挪开，只推电子书
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
