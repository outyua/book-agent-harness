<text xml:space="preserve" text-anchor="start" x="160" y="-69.5" font-family="Helvetica,Arial,sans-serif" font-size="10.00">信任边界：Pod 内跑的是模型生成的代码——长期凭证一旦进来，就等于交给攻击者（第 11 章 §11.1.2）。</text>
<text xml:space="preserve" text-anchor="start" x="160" y="-54.5" font-family="Helvetica,Arial,sans-serif" font-size="10.00">Worker 协议是闭集：Pod 不能调用管理面 RPC。</text>
<text xml:space="preserve" text-anchor="start" x="160" y="-39.5" font-family="Helvetica,Arial,sans-serif" font-size="10.00">更彻底的做法（codex exec&#45;server）：registry 只做注册与授权，流量经服务方的 rendezvous 中转，</text>
<text xml:space="preserve" text-anchor="start" x="160" y="-24.5" font-family="Helvetica,Arial,sans-serif" font-size="10.00">中转方只按 stream_id 路由、看不到明文。已知限制：registry 同时下发公钥并裁定授权，</text>
<text xml:space="preserve" text-anchor="start" x="160" y="-9.5" font-family="Helvetica,Arial,sans-serif" font-size="10.00">被攻破可以给攻击者的公钥放行；它拿不到的只是既往流量的明文。代价是可观测性下降。</text>
</g>
